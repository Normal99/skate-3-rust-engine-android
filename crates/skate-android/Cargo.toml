# Android build of skate-game. The library root is the game's own main.rs, so
# every module and `crate::` path is identical to the desktop executable; only
# the packaging (a cdylib loaded by GameActivity) differs. Keep the dependency
# list in sync with crates/skate-game/Cargo.toml.
[package]
name = "skate-android"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
name = "skate3rust"
path = "../skate-game/src/main.rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
bevy = { workspace = true, features = ["jpeg", "trace", "debug"] }
tracing-log = "0.2"
skate-core.workspace = true
skate-data.workspace = true
half = "=2.7.1"
serde_json.workspace = true
serde.workspace = true
skate-mods = { path = "../skate-mods" }
skate-vehicles = { path = "../skate-vehicles" }
skate-net = { path = "../skate-net" }
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
