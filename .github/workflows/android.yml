name: Android APK
on:
  push:
    branches: [main, 'claude/android-**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TARGET: aarch64-linux-android
      API: '30'
    steps:
      - name: Free runner disk space for the Bevy release build
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-arm64
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Configure NDK toolchain
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/${TARGET}${API}-clang"
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "NDK_BIN=$BIN"
            echo "CC_aarch64_linux_android=$BIN/${TARGET}${API}-clang"
            echo "CXX_aarch64_linux_android=$BIN/${TARGET}${API}-clang++"
            echo "AR_aarch64_linux_android=$BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/${TARGET}${API}-clang"
            echo "LIBCXX_SHARED=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$TARGET/libc++_shared.so"
          } >> "$GITHUB_ENV"
          echo "NDK: $NDK"
      - name: Build engine library (arm64-v8a)
        run: cargo build --locked --target "$TARGET" --profile android -p skate-android
      - name: Check library entry points
        run: |
          LIB="target/$TARGET/android/libskate3rust.so"
          ls -lh "$LIB"
          "$NDK_BIN/llvm-nm" -D --defined-only "$LIB" > symbols.txt
          grep -E ' android_main$' symbols.txt
          grep -E ' Java_com_sk8engine_skate3rust_SkateActivity_nativePad$' symbols.txt
          grep -E ' GameActivity_' symbols.txt || true
          "$NDK_BIN/llvm-readelf" -d "$LIB" | grep NEEDED
      - name: Stage native libraries
        run: |
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI"
          cp "target/$TARGET/android/libskate3rust.so" "$JNI/"
          cp "$LIBCXX_SHARED" "$JNI/"
      # A stable signing key lets new builds install over old ones (keeping
      # the copied game data). Add the four ANDROID_KEY* secrets to use your
      # own key; otherwise a CI key is generated once and reused from cache.
      - uses: actions/cache@v4
        with:
          path: ~/skate-ci-signing.jks
          key: android-ci-signing-key-v1
      - name: Select signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "SKATE_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "SKATE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "SKATE_KEY_ALIAS=$KEY_ALIAS"
              echo "SKATE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          # Not a secret: this key only keeps unofficial CI builds updatable.
          KEY="$HOME/skate-ci-signing.jks"
          if [ ! -f "$KEY" ]; then
            keytool -genkeypair -keystore "$KEY" -storepass skate3ci -keypass skate3ci -alias skate3ci \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Skate 3 Rust Engine CI"
          fi
          {
            echo "SKATE_KEYSTORE=$KEY"
            echo "SKATE_KEYSTORE_PASSWORD=skate3ci"
            echo "SKATE_KEY_ALIAS=skate3ci"
            echo "SKATE_KEY_PASSWORD=skate3ci"
          } >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Name APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/skate3rust-android-arm64.apk
          sha256sum dist/skate3rust-android-arm64.apk | tee dist/skate3rust-android-arm64.apk.sha256
          ls -lh dist
      # Phone-only players convert their ISO inside Termux with this bundle.
      - name: Build phone converter bundle
        run: |
          mkdir -p target/native-android dist/converter/skate3rust-converter
          rustc --edition 2024 --crate-type cdylib -C opt-level=3 -C panic=abort \
            --target "$TARGET" -C linker="$CC_aarch64_linux_android" \
            tools/asset_pipeline/refpack_native.rs -o target/native-android/librefpack.so
          git archive HEAD tools | tar -x -C dist/converter/skate3rust-converter
          # fast_refpack.py loads this exact file name on every platform.
          cp target/native-android/librefpack.so dist/converter/skate3rust-converter/tools/asset_pipeline/refpack.dll
          (cd dist/converter && zip -qr ../skate3rust-phone-converter.zip skate3rust-converter)
          rm -rf dist/converter
          sha256sum dist/skate3rust-phone-converter.zip | tee dist/skate3rust-phone-converter.zip.sha256
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: skate3rust-android-arm64
          retention-days: 14
          path: dist/
      - name: Publish android-experimental prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-experimental --cleanup-tag --yes || true
          gh release create android-experimental dist/skate3rust-android-arm64.apk dist/skate3rust-android-arm64.apk.sha256 \
            dist/skate3rust-phone-converter.zip dist/skate3rust-phone-converter.zip.sha256 \
            --prerelease --target "$GITHUB_SHA" --title "Android experimental (arm64)" \
            --notes "Built from ${GITHUB_SHA} (${GITHUB_REF_NAME}). Install the APK, then convert your own Skate 3 ISO on the phone with skate3rust-phone-converter.zip in Termux (or copy the data folder from a Windows setup). Steps: android/README.md."
